<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#fff0f5">

    <meta name="description"
          content="A little royal world created with love for my favourite princess.">

    <title>For My Princess 👑</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/main.js" defer></script>
</head>

<body>

    <main class="entrance-page">

        <div class="sparkle sparkle-one">✧</div>
        <div class="sparkle sparkle-two">✦</div>
        <div class="sparkle sparkle-three">♡</div>
        <div class="sparkle sparkle-four">✧</div>

        <div class="crown-decoration">♕</div>

        <p class="royal-label">
            A LITTLE ROYAL SURPRISE
        </p>

        <h1 class="main-heading">
            For My
            <span>Princess</span>
        </h1>

        <div class="title-divider">
            <span></span>
            ♡
            <span></span>
        </div>

        <p class="princess-name">
            My dearest Kuchuuu...
        </p>

        <p class="welcome-text">
            Somewhere in this little world,
            a thousand tiny smiles are waiting
            just for you.
        </p>

        <div class="royal-illustration">
            <div class="crown">♛</div>
            <div class="heart">♡</div>
        </div>

        <button
            type="button"
            class="enter-button"
            id="enterPrincessWorld">

            ENTER YOUR LITTLE KINGDOM
            <span>♡</span>

        </button>

        <p class="button-caption">
            Made with love, by your Puchu.
        </p>

        <footer class="entrance-footer">
            YOUR LITTLE WORLD OF LOVE ♡
        </footer>

    </main>

</body>
</html>
